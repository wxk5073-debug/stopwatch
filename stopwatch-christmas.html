<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1c070b">
<title>스모어 굽는 스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #f3d28a;
    --gold-deep: #c8943a;
    --cream: #f6ead0;
    --muted: #c9b695;
    --line: rgba(243, 210, 138, .22);
    --best: #8ef0a8;
    --worst: #ff9d9d;
    --fire-h: 300px;
    --lap-h: 132px;
    --flicker: 1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #1c070b;
    color: var(--cream);
    font-family: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    overflow-x: hidden;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }

  .stage {
    position: relative; z-index: 1;
    min-height: 100vh; min-height: 100dvh;
    display: flex; justify-content: center; align-items: center;
    padding: 78px 16px calc(var(--fire-h) + 12px);
  }

  .card {
    position: relative;
    width: min(440px, 100%);
    padding: 22px 26px 16px;
    border-radius: 24px;
    border: 1px solid rgba(243, 210, 138, .55);
    background: linear-gradient(180deg, rgba(40, 12, 18, .82), rgba(18, 6, 8, .9));
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, .6),
      0 0 34px rgba(255, 150, 60, calc(var(--flicker) * .24)),
      0 22px 50px rgba(0, 0, 0, .55),
      inset 0 0 44px rgba(0, 0, 0, .42);
  }
  .card::before {
    content: ""; position: absolute; inset: 6px; border-radius: 18px;
    border: 1px solid rgba(243, 210, 138, .2); pointer-events: none;
  }

  .card::after { /* firelight washing the card's lower edge */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 46%; border-radius: 0 0 24px 24px; pointer-events: none;
    background: radial-gradient(ellipse at 50% 118%, rgba(255, 140, 50, calc(var(--flicker) * .38)), rgba(255, 110, 30, 0) 68%);
  }
  .greet { text-align: center; line-height: 1.1; }
  .greet .script {
    font-family: "Mountains of Christmas", "Jua", cursive;
    font-weight: 700; font-size: 31px; color: var(--gold);
    text-shadow: 0 0 14px rgba(255, 190, 90, .55);
  }
  .greet .sub { font-size: 13px; color: var(--muted); letter-spacing: .28em; margin-top: 4px; }
  .greet .sub::before, .greet .sub::after { content: "❄"; color: var(--gold-deep); margin: 0 .7em; letter-spacing: 0; }

  .display {
    text-align: center; margin: 14px 0 2px;
    font-family: "Jua", "Malgun Gothic", sans-serif; font-weight: 400;
    font-size: clamp(50px, 15vw, 80px); line-height: 1.1;
    color: #ffe9b0;
    background: linear-gradient(180deg, #fff6d8 0%, #f6cf78 55%, #d9953a 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px rgba(255, 160, 60, .5));
    user-select: none; white-space: nowrap;
  }
  .display .cs { font-size: .56em; }
  .display .d { display: inline-block; width: .64em; text-align: center; }   /* fixed-width digits: no jitter with a proportional font */
  .display .c { display: inline-block; width: .3em; text-align: center; }
  .display .p { display: inline-block; width: .28em; text-align: center; }

  .status {
    text-align: center; font-size: 14px; color: var(--muted);
    min-height: 1.5em; transition: color .4s;
  }
  .status.on { color: #ffcf8a; }

  .meter { position: relative; height: 9px; margin: 9px 8px 0; border-radius: 6px; border: 1px solid rgba(243, 210, 138, .45);
    background: linear-gradient(90deg, #fffaf0, #f6d084 33%, #e2a052 50%, #b06630 65%, #54301a 82%, #1c1412); }
  .meter .zone { position: absolute; top: -4px; bottom: -4px; left: 32.7%; width: 25.5%; border: 1.5px solid rgba(255, 232, 160, .9);
    border-radius: 7px; box-shadow: 0 0 9px rgba(255, 210, 100, .55); }
  .meter b { position: absolute; top: 50%; left: 0; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #f6dc8a 70%); border: 2px solid #b8862d; box-shadow: 0 2px 5px rgba(0, 0, 0, .5); }

  .controls { display: flex; justify-content: space-evenly; padding: 0 6px; margin: 38px 0 18px; }
  .bauble {
    --c1: #cfd5e0; --c2: #596176; --hi: #fff; --glow: rgba(200, 210, 230, .25); --ink: #161b28;
    position: relative; width: 84px; height: 84px; border-radius: 50%; border: 0; padding: 0;
    font: 400 18px "Jua", "Malgun Gothic", sans-serif; letter-spacing: -.02em; color: var(--ink); cursor: pointer;
    background: radial-gradient(circle at 32% 26%, var(--hi) 0 6%, var(--c1) 30%, var(--c2) 100%);
    box-shadow:
      inset -7px -9px 15px rgba(0, 0, 0, .38),
      inset 4px 4px 10px rgba(255, 255, 255, .2),
      0 9px 18px rgba(0, 0, 0, .5),
      0 0 24px var(--glow);
    transition: transform .08s, filter .2s, opacity .2s;
  }
  .bauble::before { /* gold cap */
    content: ""; position: absolute; top: -10px; left: 50%; width: 24px; height: 13px; transform: translateX(-50%);
    border-radius: 4px 4px 2px 2px; background: linear-gradient(90deg, #b8862d, #f6dc8a 45%, #a9772a);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .5);
  }
  .bauble::after { /* hanger loop */
    content: ""; position: absolute; top: -19px; left: 50%; width: 13px; height: 13px; transform: translateX(-50%);
    border: 2px solid #d9b45a; border-bottom: 0; border-radius: 8px 8px 0 0;
  }
  .bauble:hover:not(:disabled) { filter: brightness(1.1); }
  .bauble:active:not(:disabled) { transform: scale(.95); }
  .bauble:disabled { opacity: .62; cursor: default; filter: saturate(.7); }
  .bauble:focus-visible { outline: 3px solid var(--gold); outline-offset: 5px; }
  .bauble.start { --c1: #1b8f4c; --c2: #073a20; --hi: #c4ffd8; --glow: rgba(50, 210, 110, .38); color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
  .bauble.stop  { --c1: #cc1f2e; --c2: #5a0711; --hi: #ffc9ce; --glow: rgba(255, 70, 80, .42); color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }

  ul.laps {
    list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line);
    height: var(--lap-h); overflow-y: auto; overscroll-behavior: contain;
    -webkit-mask-image: linear-gradient(#000 82%, transparent); mask-image: linear-gradient(#000 82%, transparent);
    scrollbar-width: thin; scrollbar-color: rgba(243, 210, 138, .4) transparent;
  }
  ul.laps li {
    display: grid; grid-template-columns: 1fr auto auto; align-items: baseline; column-gap: 12px;
    padding: 9px 4px; border-bottom: 1px dashed var(--line);
    font-variant-numeric: tabular-nums; font-size: 17px;
  }
  ul.laps .split { font-size: 13px; color: var(--muted); }
  ul.laps li.new { animation: lapIn .55s ease-out; }
  @keyframes lapIn {
    0% { opacity: 0; transform: translateY(-10px) scale(.97); background: rgba(255, 200, 110, .3); }
    100% { opacity: 1; transform: none; background: rgba(255, 200, 110, 0); }
  }
  ul.laps .tag { font-size: 12px; margin-left: 8px; padding: 1px 7px; border-radius: 9px; border: 1px solid currentColor; vertical-align: 2px; }
  ul.laps li.best { color: var(--best); }
  ul.laps li.worst { color: var(--worst); }
  ul.laps li.current { color: var(--gold); }
  ul.laps li.empty { display: block; text-align: center; color: var(--muted); font-size: 14px; padding: 16px 0; border: 0; }

  .hint { text-align: center; color: var(--muted); font-size: 13px; margin: 12px 0 2px; }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font: inherit; font-size: 12px; }

  .spark {
    position: fixed; z-index: 5; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, #fff 0 25%, #ffd36b 55%, transparent 72%);
    animation: spark .75s ease-out forwards;
  }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

  @media (max-height: 940px), (max-width: 420px) {
    :root { --lap-h: 60px; }
    .stage { padding-top: 60px; }
    .card { padding: 14px 20px 10px; }
    .greet .script { font-size: 26px; }
    .display { margin-top: 6px; font-size: clamp(44px, 11vw, 60px); }
    .controls { margin: 34px 0 8px; }
    .bauble { width: 72px; height: 72px; font-size: 16px; }
    ul.laps li { padding: 6px 4px; font-size: 16px; }
  }
  @media (max-height: 780px) { .hint, .greet .sub { display: none; } }
  @media (prefers-reduced-motion: reduce) { .spark { display: none; } }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<main class="stage">
  <section class="card" aria-label="스탑워치">
    <header class="greet">
      <div class="script">Merry Christmas</div>
      <div class="sub">마시멜로 굽는 스탑워치</div>
    </header>

    <div class="display" id="display" role="timer" aria-live="off"><span id="dMain"></span><span class="cs" id="dCs"></span></div>
    <div class="status" id="status" aria-live="polite">마시멜로를 꽂았어요. 시작을 눌러 구워요</div>
    <div class="meter" id="meter" aria-hidden="true"><i class="zone"></i><b id="mark"></b></div>

    <div class="controls">
      <button class="bauble" id="lapReset" disabled>뒤집기</button>
      <button class="bauble start" id="toggle">시작</button>
    </div>

    <ul class="laps" id="laps"><li class="empty">뒤집을 때마다 구운 시간이 쌓여요</li></ul>

    <p class="hint"><kbd>Space</kbd> 시작/정지 · <kbd>L</kbd> 뒤집기 · <kbd>R</kbd> 다시굽기</p>
  </section>
</main>

<script>
/* ============================================================
   Stopwatch logic
   ============================================================ */
const $ = id => document.getElementById(id);
const dMain = $('dMain'), dCs = $('dCs'), statusEl = $('status'), meterEl = $('meter'), markEl = $('mark');
const toggleBtn = $('toggle'), lapResetBtn = $('lapReset'), lapList = $('laps');

let running = false, startTime = 0, elapsed = 0, lastLapTotal = 0, laps = [], rafId = null, lastMain = '';

const pad = n => String(n).padStart(2, '0');
function fmt(ms) {
  const totalCs = Math.floor(ms / 10), cs = totalCs % 100;
  const totalSec = Math.floor(totalCs / 100), s = totalSec % 60;
  const totalMin = Math.floor(totalSec / 60), m = totalMin % 60, h = Math.floor(totalMin / 60);
  return { main: (h > 0 ? h + ':' : '') + pad(m) + ':' + pad(s), cs: pad(cs) };
}
const fmtStr = ms => { const f = fmt(ms); return f.main + '.' + f.cs; };
const now = () => running ? elapsed + (performance.now() - startTime) : elapsed;

/* ---- s'more roasting: the stopwatch time IS the roasting time ---- */
const D_MAX = 55;                       // seconds until the marshmallow is fully charred
const STAGES = [8, 18, 32, 46];         // white | toasty | golden (perfect) | dark | burnt
const stageOf = s => s < STAGES[0] ? 0 : s < STAGES[1] ? 1 : s < STAGES[2] ? 2 : s < STAGES[3] ? 3 : 4;
const STAGE_TEXT = ['하얀 마시멜로를 불에 가까이 대는 중', '노릇노릇해지는 중이에요', '황금빛! 지금 멈추면 완벽해요 ✦', '조금 진해졌어요, 서두르세요!', '앗, 까맣게 타고 있어요!'];
const RESULT_TEXT = ['하얀 마시멜로 스모어 · 말랑말랑해요', '노릇한 스모어 완성 · 부드러워요 ★', '황금빛 완벽 스모어 완성! ★★★', '진하게 구운 고소한 스모어 ★★', '앗, 숯덩이! 다시 구워볼까요?'];
const IDLE_TEXT = '마시멜로를 꽂았어요. 시작을 눌러 구워요';
const resultText = s => RESULT_TEXT[stageOf(s)];
const RC = [[0, [255, 250, 240]], [.15, [255, 241, 208]], [.33, [246, 208, 132]], [.5, [226, 160, 82]], [.65, [176, 102, 48]], [.82, [84, 48, 26]], [1, [28, 20, 18]]];
function roastColor(d) {
  d = Math.max(0, Math.min(1, d));
  for (let i = 1; i < RC.length; i++) if (d <= RC[i][0]) {
    const a = RC[i - 1], b = RC[i], t = (d - a[0]) / (b[0] - a[0]);
    return a[1].map((v, j) => Math.round(v + (b[1][j] - v) * t));
  }
  return RC[RC.length - 1][1];
}
let curStage = -1, wishing = false;
function roastState() { const ms = now(); return { sec: ms / 1000, running, finished: !running && ms > 0 }; }
// fixed-width digit cells so a proportional, cute font never makes the clock jitter
function setDigits(el, str) {
  while (el.children.length > str.length) el.lastChild.remove();
  for (let i = 0; i < str.length; i++) {
    let c = el.children[i]; if (!c) { c = document.createElement('span'); el.appendChild(c); }
    const ch = str[i], cls = ch === ':' ? 'c' : ch === '.' ? 'p' : 'd';
    if (c.className !== cls) c.className = cls;
    if (c.textContent !== ch) c.textContent = ch;
  }
}

function paint() {
  const ms = now(), f = fmt(ms), sec = ms / 1000;
  setDigits(dMain, f.main); setDigits(dCs, '.' + f.cs);
  markEl.style.left = (Math.min(1, sec / D_MAX) * 100).toFixed(2) + '%';
  if (running) {
    const s = stageOf(sec);
    if (s !== curStage) { curStage = s; if (!wishing) setStatus(STAGE_TEXT[s], true); }
  }
  if (f.main !== lastMain) { lastMain = f.main; document.title = (running ? f.main + ' · ' : '') + '스모어 스탑워치'; }
  const cur = lapList.querySelector('li.current .time');
  if (cur) cur.textContent = fmtStr(now() - lastLapTotal);
}
function loop() { paint(); rafId = requestAnimationFrame(loop); }

function setStatus(text, on) { statusEl.textContent = text; statusEl.classList.toggle('on', !!on); }
const WISHES = ['쓱 뒤집었어요, 골고루 익는 중', '치익— 달콤한 냄새가 나요', '호호 불어서 살살 돌려요', '노릇노릇 잘 굽고 있어요', '메리 크리스마스!'];
let wishI = 0, wishT = 0;
function wish() {
  wishing = true; setStatus(WISHES[wishI++ % WISHES.length], true); clearTimeout(wishT);
  wishT = setTimeout(() => { wishing = false; if (running) setStatus(STAGE_TEXT[curStage < 0 ? 0 : curStage], true); }, 2200);
}

function start() {
  running = true; startTime = performance.now();
  toggleBtn.textContent = '정지'; toggleBtn.className = 'bauble stop';
  lapResetBtn.textContent = '뒤집기'; lapResetBtn.disabled = false;
  if (!lapList.querySelector('li.current')) renderLaps();
  wishing = false; curStage = stageOf(now() / 1000); setStatus(STAGE_TEXT[curStage], true);
  scene.setRunning(true); scene.flare(1); sparkle(toggleBtn);
  rafId = requestAnimationFrame(loop);
}
function stop() {
  elapsed = now(); running = false; cancelAnimationFrame(rafId); paint();
  toggleBtn.textContent = '시작'; toggleBtn.className = 'bauble start';
  lapResetBtn.textContent = '다시굽기';
  wishing = false; clearTimeout(wishT); setStatus(resultText(elapsed / 1000), false);
  scene.setRunning(false);
}
function lap() {
  const total = now(); laps.push(total - lastLapTotal); lastLapTotal = total;
  renderLaps(true); scene.flare(.6); scene.flip(); sparkle(lapResetBtn); wish();
}
function reset() {
  elapsed = 0; lastLapTotal = 0; laps = []; lastMain = ''; paint();
  lapList.innerHTML = '<li class="empty">뒤집을 때마다 구운 시간이 쌓여요</li>';
  lapResetBtn.textContent = '뒤집기'; lapResetBtn.disabled = true;
  curStage = -1; wishing = false; clearTimeout(wishT); setStatus(IDLE_TEXT, false);
  toggleBtn.focus({ preventScroll: true });   // the reset button just became disabled: keep keyboard focus on a live control
  scene.setLevel(.45);
}
function renderLaps(fresh) {
  lapList.innerHTML = '';
  const many = laps.length >= 2, min = many ? Math.min(...laps) : 0, max = many ? Math.max(...laps) : 0;
  let cum = 0;
  const rows = laps.map((d, i) => {
    cum += d;
    const li = document.createElement('li');
    const isBest = many && d === min, isWorst = many && d === max && max !== min;
    if (isBest) li.className = 'best'; else if (isWorst) li.className = 'worst';
    if (fresh && i === laps.length - 1) li.classList.add('new');
    li.innerHTML = `<span>뒤집기 ${i + 1}${isBest ? '<span class="tag">★ 최단</span>' : isWorst ? '<span class="tag">최장</span>' : ''}</span>` +
                   `<span class="split">${fmtStr(cum)}</span><span>${fmtStr(d)}</span>`;
    return li;
  }).reverse();
  const cur = document.createElement('li');
  cur.className = 'current';
  cur.innerHTML = `<span>뒤집기 ${laps.length + 1}</span><span class="split"></span><span class="time">${fmtStr(now() - lastLapTotal)}</span>`;
  lapList.append(cur, ...rows);
}

function sparkle(btn) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = btn.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('i'); s.className = 'spark';
    const a = Math.random() * 6.283, d = 38 + Math.random() * 52;
    s.style.cssText = `left:${cx}px;top:${cy}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px`;
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
}

meterEl.style.background = 'linear-gradient(90deg,' + RC.map(([p, c]) => `rgb(${c}) ${p * 100}%`).join(',') + ')';
paint();
toggleBtn.addEventListener('click', () => running ? stop() : start());
lapResetBtn.addEventListener('click', () => running ? lap() : reset());

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (e.code === 'Space') {
    if (e.target.closest && e.target.closest('button')) return;   // a focused button handles Space natively
    e.preventDefault(); if (!e.repeat) running ? stop() : start(); return;
  }
  if (e.repeat) return;
  if ((k === 'l' || k === 'ㅣ') && running) lap();
  else if ((k === 'r' || k === 'ㄱ') && !running && !lapResetBtn.disabled) reset();
});

/* ============================================================
   Animated fireplace scene (canvas)
   ============================================================ */
const scene = (() => {
  const cv = $('scene'), ctx = cv.getContext('2d');
  const root = document.documentElement;
  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  let reduce = mq.matches;
  if (mq.addEventListener) mq.addEventListener('change', e => { reduce = e.matches; });
  const bgc = document.createElement('canvas'), bg = bgc.getContext('2d');
  const PAL = [[255, 70, 70], [255, 200, 80], [90, 230, 140], [90, 170, 255]];

  let W = 0, H = 0, DPR = 1, L = {};
  let lights = [], candles = [], flakes = [], flames = [], sparks = [];
  let intensity = .45, targetI = .45, boost = 0, flick = 1, spawnAcc = 0, sparkAcc = 0, last = 0, lastVar = 0;
  let roastP = 0, finP = 0, flipCur = 0, flipTgt = 0;     // marshmallow in-fire / s'more done / flip spin

  const mkRand = seed => () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const rr = (g, x, y, w, h, r) => {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  };
  const SPR = {};
  const sprite = i => {
    if (SPR[i]) return SPR[i];
    const [r, g, b] = PAL[i], c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.14, `rgba(${r},${g},${b},.95)`);
    gr.addColorStop(.42, `rgba(${r},${g},${b},.30)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
    return SPR[i] = c;
  };

  // 12 pre-rendered flame tongues, young (white-gold) to old (deep red)
  const FL = [];
  for (let i = 0; i < 12; i++) {
    const tt = i / 11, c = document.createElement('canvas'); c.width = 64; c.height = 128;
    const g = c.getContext('2d'), G = Math.round(215 - 165 * tt), B = Math.round(90 * (1 - tt) * (1 - tt)), mix = (1 - tt) * .75;
    g.filter = 'blur(3px)';
    const gr = g.createRadialGradient(32, 104, 2, 32, 96, 78);
    gr.addColorStop(0, `rgba(255,${Math.round(G + (255 - G) * mix)},${Math.round(B + (200 - B) * mix)},1)`);

    for (let i = 0; i < n; i++) swag(g, r, W * i / n, -6, W * (i + 1) / n, -6, sag, 15, 38, 5.4);
    for (let i = 0; i <= n; i++) bow(g, W * i / n, 4, 15);
  }

  /* ---------- sizing ---------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = bgc.width = Math.round(W * DPR); cv.height = bgc.height = Math.round(H * DPR);
    if (!W || !H) return;
    buildLayout(); buildBackground();
    root.style.setProperty('--fire-h', Math.round(L.fireH * 1.22) + 'px');
    const target = reduce ? 36 : Math.max(50, Math.min(140, Math.round(W * H / 15000)));
    while (flakes.length < target) flakes.push({ x: Math.random() * W, y: Math.random() * H, r: .8 + Math.random() * 2.2, vy: .25 + Math.random() * .7, ph: Math.random() * 6.283, sw: .3 + Math.random() * .8 });
    flakes.length = target;
    flakes.forEach(f => { f.x = Math.min(f.x, W); f.y = Math.min(f.y, H); });
  }
  let rzPending = false;
  addEventListener('resize', () => { if (rzPending) return; rzPending = true; requestAnimationFrame(() => { rzPending = false; resize(); }); });

  /* ---------- s'more: marshmallow stick + plate ---------- */
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  function marsh(x, y, w, h, ang, d, spin) {       // w = thickness, h = length along the stick
    const c1 = roastColor(d * .8), c2 = roastColor(Math.min(1, d * 1.08 + .04));
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2); g.addColorStop(0, rgb(c1)); g.addColorStop(1, rgb(c2));
    rr(ctx, -w / 2, -h / 2, w, h, w * .34); ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = `rgba(90,45,15,${.18 + .3 * d})`; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = `rgba(255,255,255,${.5 * (1 - d)})`; rr(ctx, -w * .34 + Math.cos(spin) * w * .16, -h * .4, w * .17, h * .62, w * .08); ctx.fill();
    if (d > .35) {
      ctx.fillStyle = `rgba(60,28,10,${Math.min(.35, (d - .35) * .8)})`;
      for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc((((i * 37) % 11) - 5) / 5 * w * .3, (((i * 53) % 13) - 6) / 6 * h * .38, w * .05, 0, 6.283); ctx.fill(); }
    }
    ctx.restore();
  }
  function drawPlate(t, d, fin) {
    const { fw, surrBottom, hearthH, cx } = L, u = fw / 77, px = cx - fw * .4, py = surrBottom - hearthH * .42;   // plate ~30% bigger so the s'more reads clearly
    const gw = u * 10, gh = u * 1.7, cw = u * 8.6, ch = u * 1.1, y0 = -u * .9;
    const cracker = (yy, rot) => {
      ctx.save(); ctx.translate(0, yy); ctx.rotate(rot);
      rr(ctx, -gw / 2, -gh, gw, gh, u * .4); ctx.fillStyle = '#d9a45a'; ctx.fill(); ctx.strokeStyle = 'rgba(120,70,20,.55)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#b8803a'; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(i * gw * .25, -gh / 2, u * .22, 0, 6.283); ctx.fill(); }
      ctx.restore();
    };
    ctx.save(); ctx.translate(px, py);
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(0, u * .9, u * 11.5, u * 2.7, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#f3ead8'; ctx.beginPath(); ctx.ellipse(0, 0, u * 10.5, u * 2.4, 0, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#c8943a'; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.fillStyle = '#e5d9c0'; ctx.beginPath(); ctx.ellipse(0, 0, u * 7.4, u * 1.5, 0, 0, 6.283); ctx.fill();
    cracker(y0, 0);
    const yTop = y0 - gh - ch;
    rr(ctx, -cw / 2, yTop, cw, ch, u * .25); ctx.fillStyle = '#4a2412'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,200,150,.2)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let i = -1; i <= 1; i++) { ctx.moveTo(i * cw * .25, yTop); ctx.lineTo(i * cw * .25, yTop + ch); } ctx.stroke();
    if (fin < .98) {                                  // the top cracker waits, leaning on the stack
      ctx.save(); ctx.globalAlpha = 1 - fin; ctx.translate(gw * .5 + gh * .6, y0 - gh * .2); ctx.rotate(-1.18);
      rr(ctx, 0, -gh, gw, gh, u * .4); ctx.fillStyle = '#d9a45a'; ctx.fill(); ctx.strokeStyle = 'rgba(120,70,20,.55)'; ctx.stroke(); ctx.restore();
    }
    if (fin > .02) {                                  // the roasted marshmallow joins the s'more
      const mt = u * 3.4;
      ctx.save(); ctx.globalAlpha = fin;
      marsh(0, yTop - mt / 2 + u * .1, mt, u * 8.2, Math.PI / 2, d, 0);
      cracker(yTop - mt - (1 - fin) * u * 8, .035);
      if (d >= STAGES[1] / D_MAX && d <= STAGES[2] / D_MAX) {   // golden = perfect → it glows
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = fin * (.45 + .2 * Math.sin(t * .006));
        const s = u * 22; ctx.drawImage(sprite(1), -s / 2, yTop - mt - s / 2, s, s);
      }
      ctx.restore();
    }
    ctx.restore();
  }
  function drawStick(t, d, rs) {
    const a = 1 - finP; if (a <= .02) return;
    const { bx, by, bw, bh, cx, fw } = L, run = rs.running, p = roastP, e = p * p * (3 - 2 * p);
    const inX = cx + bw * .06, inY = by + bh * .62, outX = bx + bw * 1.15, outY = by + bh * .5;
    const mx = outX + (inX - outX) * e + (run ? Math.sin(t * .0031) * bh * .012 : 0);
    const my = outY + (inY - outY) * e + Math.sin(t * (run ? .0042 : .0016)) * bh * .01 - Math.sin(p * Math.PI) * bh * .1;
    const ex = cx + fw * .66, ey = H + 30;
    let dx = mx - ex, dy = my - ey; const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
    const lw = Math.max(3, bh * .026), mh = bh * .27, mw = bh * .21 * (1 + .14 * Math.abs(Math.sin(flipCur * Math.PI)));
    const tx = mx + dx * mh * .72, ty = my + dy * mh * .72;
    ctx.save(); ctx.globalAlpha = a; ctx.lineCap = 'round';
    ctx.strokeStyle = '#6d4424'; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,225,175,.4)'; ctx.lineWidth = lw * .3; ctx.beginPath(); ctx.moveTo(ex - 1, ey - 1); ctx.lineTo(tx - 1, ty - 1); ctx.stroke();
    ctx.strokeStyle = '#c62839'; ctx.lineWidth = lw * 1.9; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(ex + dx * 70, ey + dy * 70); ctx.lineTo(ex + dx * 92, ey + dy * 92); ctx.stroke();
    if (p > .5) {                                      // firelight on the marshmallow
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a * (p - .5) * .5 * flick;
      const s = mh * 3.2; ctx.drawImage(sprite(1), mx - s / 2, my - s / 2, s, s);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = a;
    }
    marsh(mx, my, mw, mh, Math.atan2(dy, dx) - Math.PI / 2, d, flipCur * Math.PI);
    if (run && p > .7 && d > .85) {                    // it caught fire!
      ctx.globalCompositeOperation = 'lighter';
      const fl = .8 + .25 * Math.sin(t * .03), h = mh * 1.3 * fl, w = mh * .85;
      ctx.globalAlpha = a * .9; ctx.drawImage(FL[2], mx - w / 2, my - mh * .35 - h * .86, w, h);
    }
    ctx.restore();
  }

  /* ---------- animation ---------- */
  function frame(t) {
    if (innerWidth !== W || innerHeight !== H) resize();           // missed resize / zero-size first layout
    if (!bgc.width || !bgc.height) { requestAnimationFrame(frame); return; }
    const dt =Math.min(48, t - last || 16.7); last = t; const k = dt / 16.67;
    intensity += (targetI - intensity) * .09 * k; boost *= Math.pow(.96, k);
    const I = intensity + boost * .4;
    flick = .88 + .07 * Math.sin(t * .011) + .04 * Math.sin(t * .027 + 1.3) + .03 * Math.sin(t * .061 + .4) + .02 * Math.sin(t * .13);
    if (reduce) flick = .9;
    if (t - lastVar > 70) { lastVar = t; root.style.setProperty('--flicker', flick.toFixed(3)); }

    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.drawImage(bgc, 0, 0); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const { bx, by, bw, bh, cx } = L;
    // room glow
    ctx.globalCompositeOperation = 'lighter';
    let a = (.1 + .14 * I) * flick, gy = by + bh * .75;
    let gr = ctx.createRadialGradient(cx, gy, 0, cx, gy, Math.max(W, H) * .75);
    gr.addColorStop(0, `rgba(255,120,30,${a})`); gr.addColorStop(.35, `rgba(200,70,20,${a * .45})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    a = .2 * I * flick; gr = ctx.createRadialGradient(cx, gy, 0, cx, gy, L.fw * .95);
    gr.addColorStop(0, `rgba(255,140,50,${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);

    // fire (clipped to firebox)
    ctx.save(); boxPath(ctx); ctx.clip(); ctx.globalCompositeOperation = 'lighter';
    gr = ctx.createRadialGradient(cx, by + bh, 0, cx, by + bh, bw * .75);
    gr.addColorStop(0, `rgba(255,110,20,${.6 * I * flick})`); gr.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.fillStyle = gr; ctx.fillRect(bx, by, bw, bh);
    gr = ctx.createRadialGradient(cx, by + bh * .95, 0, cx, by + bh * .95, bw * .5); // ember bed under the logs
    gr.addColorStop(0, `rgba(255,150,40,${.55 * (.7 + .3 * I)})`); gr.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.fillStyle = gr; ctx.fillRect(bx, by + bh * .6, bw, bh * .4);
    for (let i = 0; i < 9; i++) {                       // pulsing charcoal between the logs
      const dx = ((i * 41) % 9 - 4) / 4.5 * bw * .38, dy = by + bh * (.84 + ((i * 29) % 7) / 7 * .12);
      const pulse = .3 + .7 * (.5 + .5 * Math.sin(t * .004 + i * 1.7)), s = bh * (.09 + (i % 3) * .02);
      ctx.globalAlpha = pulse * (1.05 - .4 * I) * .8; ctx.drawImage(sprite(0), cx + dx - s / 2, dy - s / 2, s, s);
    }
    ctx.globalAlpha = 1;

    spawnAcc += (1.0 + 1.5 * I) * k * (reduce ? .5 : 1);
    const sc = bh / 140;
    while (spawnAcc >= 1) {
      spawnAcc--;
      flames.push({ x: cx + (Math.random() - .5) * bw * .5 * (.6 + .4 * I), y: by + bh * .9 - Math.random() * bh * .05, vx: (Math.random() - .5) * .5,
        vy: -(.35 + Math.random() * .45) * (.55 + .45 * I + boost * .3) * sc, life: 0, max: 38 + Math.random() * 32, size: bw * (.06 + Math.random() * .055) * (.72 + .4 * I), seed: Math.random() * 10 });
    }
    for (let i = flames.length - 1; i >= 0; i--) {
      const f = flames[i]; f.life += k; const tt = f.life / f.max;
      if (tt >= 1) { flames[i] = flames[flames.length - 1]; flames.pop(); continue; }
      f.x += f.vx * k + Math.sin(t * .004 + f.seed) * .25 * k + (cx - f.x) * .012 * k; f.y += f.vy * k; f.vy *= Math.pow(.99, k);
      const w = f.size * 2.3 * (1 - tt * .55), h = w * 2, al = (tt < .12 ? tt / .12 : 1) * Math.pow(1 - tt, .9) * .3;
      ctx.globalAlpha = al; ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.vx * .35 + Math.sin(t * .006 + f.seed) * .12);
      ctx.drawImage(FL[Math.min(11, (tt * 12) | 0)], -w / 2, -h * .86, w, h); ctx.restore(); ctx.globalAlpha = 1;
    }
    ctx.restore();
    // embers drift up and out of the firebox, curling a little
    ctx.globalCompositeOperation = 'lighter';
    sparkAcc += (.08 + .22 * I + boost * .2) * k * (reduce ? .5 : 1);
    while (sparkAcc >= 1) { sparkAcc--; sparks.push({ x: cx + (Math.random() - .5) * bw * .55, y: by + bh * .7, vx: (Math.random() - .5) * .5, vy: -(.7 + Math.random() * 1.1) * sc, life: 0, max: 90 + Math.random() * 90, ph: Math.random() * 6.283, s: 4 + Math.random() * 5 }); }
    const topFade = by - bh * .25;
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i]; p.life += k; const tt = p.life / p.max;
      if (tt >= 1 || p.y < topFade) { sparks[i] = sparks[sparks.length - 1]; sparks.pop(); continue; }
      p.x += (p.vx + Math.sin(p.life * .09 + p.ph) * .45) * k; p.y += p.vy * k; p.vy *= Math.pow(.995, k);
      const al = (1 - tt) * Math.min(1, Math.max(0, (p.y - topFade) / (bh * .2))), sz = p.s * (1 - tt * .5);
      ctx.globalAlpha = al * (.6 + .4 * Math.sin(t * .02 + p.ph)); ctx.drawImage(sprite(1), p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;

    // twinkling lights
    ctx.globalCompositeOperation = 'lighter';
    for (const l of lights) {
      const b = reduce ? .85 : l.star ? .75 + .25 * Math.sin(t * .002 + l.ph) : .4 + .6 * (.5 + .5 * Math.sin(t * .0035 * l.sp + l.ph));
      const sz = l.r * (l.star ? 4 : 2.6 + b * 1.8); ctx.globalAlpha = b; ctx.drawImage(sprite(l.c), l.x - sz / 2, l.y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
    // candle flames
    for (const c of candles) {
      const fl = 1 + .12 * Math.sin(t * .02 + c.ph) + .07 * Math.sin(t * .047 + c.ph * 2), h = c.s * 2.1 * fl;
      const gs = c.s * 14; ctx.globalAlpha = .55 * flick; ctx.drawImage(sprite(1), c.x - gs / 2, c.y - h * .5 - gs / 2, gs, gs); ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      const fg = ctx.createRadialGradient(c.x, c.y - h * .25, 0, c.x, c.y - h * .35, h * .7); fg.addColorStop(0, '#fffbe0'); fg.addColorStop(.35, '#ffd25c'); fg.addColorStop(1, 'rgba(255,120,20,0)');
      ctx.fillStyle = fg; ctx.beginPath(); ctx.ellipse(c.x + Math.sin(t * .006 + c.ph) * .8, c.y - h * .4, c.s * .42, h * .62, 0, 0, 6.283); ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
    }

    // s'more: plate + roasting stick (time-driven by the stopwatch)
    {
      const rs = roastState(), d = Math.min(1, rs.sec / D_MAX);
      roastP += ((rs.running ? 1 : 0) - roastP) * .07 * k;
      finP += ((rs.finished ? 1 : 0) - finP) * .09 * k;
      flipCur += (flipTgt - flipCur) * .13 * k;
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      drawPlate(t, d, finP); drawStick(t, d, rs);
    }
    // snow
    ctx.globalCompositeOperation = 'source-over';
    for (const f of flakes) {
      const m = reduce ? 0 : 1; f.y += f.vy * (f.r * .6 + .4) * k * m; f.x += Math.sin(t * .0007 * f.sw + f.ph) * .3 * k * m;
      if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; } if (f.x > W + 4) f.x = -4; else if (f.x < -4) f.x = W + 4;
      ctx.fillStyle = `rgba(255,255,255,${.25 + f.r * .12})`; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
    }
    requestAnimationFrame(frame);
  }

  resize(); requestAnimationFrame(frame);
  return {
    setLevel(v) { targetI = v; },
    setRunning(r) { targetI = r ? 1 : .3; },
    flare(v = 1) { boost = Math.min(1.6, boost + v); },
    flip() { flipTgt += 1; }
  };
})();
</script>
</body>
